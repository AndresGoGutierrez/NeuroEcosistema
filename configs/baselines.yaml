# Rule-based reference policies (ADR-012).
# PROVISIONAL pre-P1 values (decision A5); P1 tunes them with a small grid and freezes them.
rules:
  prey:
    flee_threshold: 0.3    # flee when predator1_proximity > 0.3 (distance < 0.7 * R_v)
    cruise_fraction: 0.5   # speed when nothing is perceived, as a fraction of v_max
  predator:
    cruise_fraction: 0.5
