# NeuroEcosistema - base configuration.
#
# project_seed: root entropy for every random stream of the project (ADR-028).
# Generated once in F0 with secrets.randbits(128). It MUST NOT change afterwards:
# changing it invalidates every pilot, run and result derived from it.
project_seed: 151810796106167051982782525292607188790

# World parameters. FROZEN by P1 (F4, ADR-020, ADR-033): calibration iteration 007 confirmed with
# seed groups 20/21/22; tag env-frozen-v1. They satisfy K1-K4 and E1, E2, E5. Stage A kept the
# provisional plant_energy, regrow_delay and n_plants.
world:
  size: 150.0
  t_max: 1000
  n_prey: 25
  n_predators: 3
  n_plants: 40
  regrow_delay: 50
  capture_radius: 2.5     # K1: >= 1.3 + 1.0
  eat_radius: 1.5         # K2: >= 1.0
  plant_energy: 30.0      # E5: <= 0.5 * prey.e_max
  prey_energy: 40.0
  prey:
    v_max: 1.0
    omega_max: 0.5        # K4: > predator.omega_max
    vision_radius: 20.0   # K3: < size / 2
    e_max: 100.0
    initial_energy_fraction: 0.8
    c_basal: 0.16         # E1: 80 / 0.16 = 500 = 0.5 * t_max
    c_move: 0.32          # E2: >= c_basal
  predator:
    v_max: 1.3            # K4: > prey.v_max
    omega_max: 0.3
    vision_radius: 20.0
    e_max: 100.0
    initial_energy_fraction: 0.8
    c_basal: 0.16
    c_move: 0.32
