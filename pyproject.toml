[project]
name = "neuroeco"
version = "0.1.0"
description = "NeuroEcosistema: predator-prey ecosystem driven by neuroevolved multilayer perceptrons."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # domain + application (ADR-001): numpy is the only third-party package allowed
    "numpy>=2.1",
    # infrastructure (ADR-016, ADR-022)
    "pyyaml>=6.0",
    "threadpoolctl>=3.5",
    # analysis (ADR-017, ADR-023)
    "pandas>=2.2",
    "scipy>=1.14",
    "matplotlib>=3.9",
    # presentation
    "typer>=0.12",
    "pygame-ce>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuroeco"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "N",        # pep8-naming
    "SIM",      # simplify
    "NPY",      # numpy rules; NPY002 forbids the legacy global np.random API (ADR-028)
    "TID",      # banned imports (see below)
    "RUF",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"random".msg = "Use an injected numpy.random.Generator derived from SeedRegistry (ADR-028)."

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests (statistical coverage, long simulations)",
    "determinism: bit-for-bit reproducibility checks (ADR-016, ADR-028)",
]

# ---------------------------------------------------------------- import-linter (ADR-001, ADR-021)
[tool.importlinter]
root_package = "neuroeco"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture layers"
type = "layers"
layers = [
    "neuroeco.presentation",
    "neuroeco.infrastructure",
    "neuroeco.application",
    "neuroeco.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application import no third-party package except numpy"
type = "forbidden"
source_modules = ["neuroeco.domain", "neuroeco.application"]
forbidden_modules = ["yaml", "pandas", "scipy", "matplotlib", "pygame", "typer", "threadpoolctl"]

[[tool.importlinter.contracts]]
name = "Analysis only reads result files"
type = "forbidden"
source_modules = ["neuroeco.analysis"]
forbidden_modules = [
    "neuroeco.domain",
    "neuroeco.application",
    "neuroeco.infrastructure",
    "neuroeco.presentation",
]
